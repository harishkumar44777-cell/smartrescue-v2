services:
  - type: web
    name: smartrescue-unified
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # Database setup (Replace with Managed Service connection strings)
      - key: DB_HOST
        value: 'your-database-host'
      - key: DB_USER
        value: 'your-database-user'
      - key: DB_PASSWORD
        value: 'your-database-password'
      - key: DB_NAME
        value: 'smartrescue'
